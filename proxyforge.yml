name: ProxyForge
on:
  workflow_dispatch:
  schedule:
    - cron: '0,45 * * * *'
permissions:
  contents: write
concurrency:
  group: proxyforge
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      TRANSFER_BASE: https://nondurable-tabetha-cellular.ngrok-free.dev
      CYCLE_SECONDS: '2580'
      UPLOAD_SECONDS: '600'
      OUTPUT_DIR: proxy-lists
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run scraper and publish periodic snapshots
        shell: bash
        run: python3 .github/proxyforge_runner.py
      - name: Commit final files even on failure
        if: always()
        shell: bash
        run: |
          python3 .github/proxyforge_runner.py --finalize-only || true
