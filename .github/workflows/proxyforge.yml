name: ProxyForge

on:
  workflow_dispatch:

  schedule:
    - cron: "0,45 * * * *"

permissions:
  contents: write

concurrency:
  group: proxyforge
  cancel-in-progress: false

jobs:
  proxyforge:
    name: ProxyForge Live Checker
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"

      # Transfer.sh
      TRANSFER_BASE: "https://nondurable-tabetha-cellular.ngrok-free.dev"

      # Upload every 5 minutes
      UPLOAD_SECONDS: "300"

      # Run for 43 minutes
      CYCLE_SECONDS: "2580"

      # Output directory
      OUTPUT_DIR: "proxy-lists"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify ProxyForge files
        run: |
          set -euo pipefail

          test -f pfm_fixed.py
          test -f .github/proxyforge_runner.py

          python -m py_compile pfm_fixed.py
          python -m py_compile .github/proxyforge_runner.py

          mkdir -p proxy-lists

          echo "ProxyForge files verified."

      - name: Initialize README
        run: |
          if [ ! -f README.md ]; then
            cat > README.md <<'EOF'
          # ProxyForge

          Automatically updated proxy lists.

          ## Live Proxy Downloads

          Download links will appear here after the first successful upload.
          EOF
          fi

          echo "README initialized."

      - name: Start ProxyForge and live uploads
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "             PROXYFORGE"
          echo "=========================================="
          echo "Transfer.sh: $TRANSFER_BASE"
          echo "Upload interval: ${UPLOAD_SECONDS}s"
          echo "Runtime: ${CYCLE_SECONDS}s"
          echo "Protocols: HTTP HTTPS SOCKS4 SOCKS5"
          echo "=========================================="

          python -u .github/proxyforge_runner.py

      - name: Save final proxy files
        if: always()
        run: |
          set -euo pipefail

          echo "Saving final proxy lists..."

          python -u .github/proxyforge_runner.py --finalize-only

      - name: Display final results
        if: always()
        run: |
          echo "=========================================="
          echo "          FINAL PROXY RESULTS"
          echo "=========================================="

          for type in http https socks4 socks5; do
            file="proxy-lists/${type}_proxies.txt"

            if [ -f "$file" ]; then
              count=$(wc -l < "$file")
              echo "${type^^}: $count proxies"
            else
              echo "${type^^}: No results"
            fi
          done

          echo "=========================================="

          if [ -f .github/proxyforge_links.json ]; then
            echo "LATEST TRANSFER.SH LINKS:"

            python - <<'PY'
          import json

          with open(".github/proxyforge_links.json") as f:
              links = json.load(f)

          for kind in ("http", "https", "socks4", "socks5"):
              url = links.get(kind)
              if url:
                  print(f"{kind.upper()}: {url}")
          PY
          fi

      - name: Generate Actions summary
        if: always()
        run: |
          {
            echo "## ProxyForge Results"
            echo
            echo "| Proxy Type | Count | Download |"
            echo "|---|---:|---|"

            python - <<'PY'
          import json
          from pathlib import Path

          links_file = Path(".github/proxyforge_links.json")

          if links_file.exists():
              links = json.loads(links_file.read_text())
          else:
              links = {}

          for kind in ("http", "https", "socks4", "socks5"):
              path = Path("proxy-lists") / f"{kind}_proxies.txt"

              if path.exists():
                  count = sum(1 for _ in path.open())
              else:
                  count = 0

              url = links.get(kind)

              download = f"[Download]({url})" if url else "Unavailable"

              print(f"| {kind.upper()} | {count} | {download} |")
          PY

          } >> "$GITHUB_STEP_SUMMARY"
